name: OSV Scanner

on:
  push:
    paths:
      - 'package-lock.json'
  pull_request:
    paths:
      - 'package-lock.json'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action@v2
        with:
          scan-args: --lockfile=package-lock.json
